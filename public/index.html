<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>জেগে থাকো</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04050b;
    --ink: #e8f6ff;
    --cyan: #3df0ff;
    --violet: #8b5cff;
    --ok: #35ff8f;
    --alarm: #ff2a4d;
    --idle: #6b7280;
    --font: "Hind Siliguri", "Noto Sans Bengali", "Kalpurush", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; }

  /* ---------- ইন্ট্রো স্ক্রিন ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    background: radial-gradient(ellipse at 50% 40%, #0d1230 0%, var(--bg) 65%);
    transition: opacity .7s ease, visibility .7s;
  }
  #intro.hide { opacity: 0; visibility: hidden; }

  .eye { width: min(64vw, 340px); overflow: visible; filter: drop-shadow(0 0 14px var(--cyan)); }
  .eye .outline {
    fill: none; stroke: var(--cyan); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 520; stroke-dashoffset: 520;
    animation: draw 1.6s cubic-bezier(.6,.1,.2,1) .2s forwards;
  }
  .eye .iris {
    fill: none; stroke: var(--violet); stroke-width: 3;
    transform-origin: 100px 60px; transform: scale(0);
    animation: pop .7s cubic-bezier(.2,1.4,.4,1) 1.5s forwards;
  }
  .eye .pupil {
    fill: var(--cyan);
    transform-origin: 100px 60px; transform: scale(0);
    animation: pop .5s cubic-bezier(.2,1.4,.4,1) 1.75s forwards, glow 2.2s ease-in-out 2.3s infinite;
  }
  .eye .lid {
    fill: var(--bg); transform-origin: 100px 60px; transform: scaleY(0);
    animation: blink .5s ease-in-out 2.1s 1;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop  { to { transform: scale(1); } }
  @keyframes glow { 50% { opacity: .55; } }
  @keyframes blink { 0%, 100% { transform: scaleY(0); } 50% { transform: scaleY(1); } }

  .title {
    font-size: clamp(34px, 8vw, 56px); font-weight: 700; letter-spacing: .01em;
    color: var(--ink); text-shadow: 0 0 18px rgba(61,240,255,.65), 0 0 42px rgba(139,92,255,.45);
    opacity: 0; transform: translateY(14px);
    animation: rise .8s ease 1.9s forwards;
  }
  #startBtn {
    font-family: var(--font); font-size: 20px; font-weight: 700; color: var(--bg);
    background: var(--cyan); border: 0; border-radius: 999px; padding: 14px 44px; cursor: pointer;
    box-shadow: 0 0 22px rgba(61,240,255,.7), 0 0 60px rgba(61,240,255,.3);
    opacity: 0; transform: translateY(14px);
    animation: rise .7s ease 2.4s forwards;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  #startBtn:hover { transform: scale(1.05); }
  #startBtn:active { transform: scale(.96); }
  #startBtn:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* ---------- ক্যামেরা স্টেজ ---------- */
  #stage { position: fixed; inset: 0; background: #000; opacity: 0; transition: opacity .8s ease; }
  #stage.show { opacity: 1; }
  #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #cam.mirror { transform: scaleX(-1); }

  /* চোখ বন্ধ হলে লাল পালসিং বর্ডার */
  #alarmGlow {
    position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s ease;
    box-shadow: inset 0 0 0 6px var(--alarm), inset 0 0 90px 12px rgba(255,42,77,.75);
  }
  #alarmGlow.on { opacity: 1; animation: pulse .6s ease-in-out infinite alternate; }
  @keyframes pulse { from { filter: brightness(.7); } to { filter: brightness(1.5); } }

  /* স্ট্যাটাস ডট */
  #dot {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 18px); left: 18px;
    width: 16px; height: 16px; border-radius: 50%; background: var(--idle);
    box-shadow: 0 0 10px var(--idle); transition: background .25s, box-shadow .25s;
  }
  #dot.loading { animation: dotload 1s ease-in-out infinite; }
  #dot.open  { background: var(--ok);    box-shadow: 0 0 14px var(--ok); }
  #dot.shut  { background: var(--alarm); box-shadow: 0 0 16px var(--alarm); }
  @keyframes dotload { 50% { opacity: .3; } }

  /* ক্যামেরা সুইচ বাটন */
  #switchBtn {
    position: absolute; right: 18px; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    width: 54px; height: 54px; border-radius: 50%; cursor: pointer;
    display: grid; place-items: center; color: var(--ink);
    background: rgba(8,10,24,.55); border: 1.5px solid rgba(61,240,255,.7);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 0 16px rgba(61,240,255,.4);
    transition: transform .3s ease, box-shadow .2s ease;
  }
  #switchBtn:hover { box-shadow: 0 0 24px rgba(61,240,255,.8); }
  #switchBtn:active { transform: rotate(180deg) scale(.92); }
  #switchBtn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #switchBtn svg { width: 26px; height: 26px; }

  /* এরর মেসেজ */
  #error {
    position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 24px;
    background: rgba(4,5,11,.92);
  }
  #error.show { display: flex; }
  #error .card {
    max-width: 420px; text-align: center; padding: 28px 26px; border-radius: 18px;
    border: 1.5px solid var(--alarm); box-shadow: 0 0 30px rgba(255,42,77,.35);
    background: #0b0d1c;
  }
  #error p { font-size: 18px; line-height: 1.7; margin-bottom: 20px; }
  #error button {
    font-family: var(--font); font-size: 17px; font-weight: 700; padding: 10px 30px; border-radius: 999px;
    border: 0; cursor: pointer; background: var(--alarm); color: #fff;
  }

  @media (prefers-reduced-motion: reduce) {
    .eye .outline, .eye .iris, .eye .pupil, .title, #startBtn { animation-duration: .01s; animation-delay: 0s; }
    .eye .lid { animation: none; }
  }
</style>
</head>
<body>

<!-- ইন্ট্রো -->
<section id="intro">
  <svg class="eye" viewBox="0 0 200 120" aria-hidden="true">
    <path class="outline" d="M6 60 Q100 -20 194 60 Q100 140 6 60 Z"/>
    <circle class="iris" cx="100" cy="60" r="30"/>
    <circle class="pupil" cx="100" cy="60" r="13"/>
    <path class="lid" d="M2 60 Q100 -24 198 60 Q100 144 2 60 Z"/>
  </svg>
  <h1 class="title">জেগে থাকো</h1>
  <button id="startBtn" type="button">শুরু করো</button>
</section>

<!-- ক্যামেরা -->
<main id="stage" aria-live="polite">
  <video id="cam" playsinline muted autoplay></video>
  <div id="alarmGlow"></div>
  <div id="dot" class="loading" role="status" aria-label="চোখের অবস্থা"></div>
  <button id="switchBtn" type="button" aria-label="ক্যামেরা পরিবর্তন করো">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
      <path d="M9.5 13.5a2.5 2.5 0 0 1 4.3-1.7M14.5 13.5a2.5 2.5 0 0 1-4.3 1.7"/>
      <path d="M13.8 10.6v1.4h-1.4M10.2 16.4V15h1.4"/>
    </svg>
  </button>
</main>

<!-- এরর -->
<div id="error" role="alert">
  <div class="card">
    <p id="errorText"></p>
    <button id="retryBtn" type="button">আবার চেষ্টা করো</button>
  </div>
</div>

<script type="module">
/* ================= সেটিংস (দরকারমতো বদলাও) ================= */
const CLOSED_THRESHOLD = 0.55;   // eyeBlink স্কোর এর চেয়ে বেশি হলে চোখ বন্ধ ধরা হবে (০–১)
const CLOSED_HOLD_MS   = 400;    // এতক্ষণ বন্ধ থাকলে তবেই অ্যালার্ম (সাধারণ পলকে বাজবে না)
const MP_VERSION       = "0.10.14";
const MP_BUNDLE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/vision_bundle.mjs`;
const MP_WASM   = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/wasm`;
const MP_MODEL  = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

/* ================= এলিমেন্ট ================= */
const $ = (id) => document.getElementById(id);
const intro = $("intro"), stage = $("stage"), cam = $("cam");
const dot = $("dot"), glow = $("alarmGlow");
const errBox = $("error"), errText = $("errorText");

let facing = "user";          // "user" = ফ্রন্ট, "environment" = ব্যাক
let stream = null;
let landmarker = null;
let running = false;

/* ================= অডিও ================= */
const alarmAudio = $("alarmAudio");   // মিনিয়ন্স অ্যালার্ম মিউজিক (ফাইলের ভেতরেই এমবেড করা)
alarmAudio.loop = true;
alarmAudio.volume = 1;

let audioCtx = null;      // শুধু ফলব্যাক বিপের জন্য
let alarmOn = false;
let beepTimer = null;

// ইউজারের ক্লিকের ভেতরে অডিও আনলক করা হয় (ব্রাউজারের অটোপ্লে পলিসির জন্য)
function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
  } catch (e) {}
  alarmAudio.muted = true;
  alarmAudio.play().then(() => {
    if (!alarmOn) { alarmAudio.pause(); alarmAudio.currentTime = 0; }
    alarmAudio.muted = false;
  }).catch(() => { alarmAudio.muted = false; });
}

// মিউজিক চালাতে না পারলে বিপ ফলব্যাক
function beepOnce(freq) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "square";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.6, audioCtx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.22);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.24);
}

function startBeeps() {
  let hi = false;
  beepOnce(900);
  beepTimer = setInterval(() => { hi = !hi; beepOnce(hi ? 700 : 900); }, 260);
}

function startAlarm() {
  if (alarmOn) return;
  alarmOn = true;
  glow.classList.add("on");
  alarmAudio.muted = false;
  alarmAudio.currentTime = 0;
  const p = alarmAudio.play();
  if (p && p.catch) p.catch(() => { if (alarmOn && !beepTimer) startBeeps(); });
}

function stopAlarm() {
  if (!alarmOn) return;
  alarmOn = false;
  glow.classList.remove("on");
  alarmAudio.pause();          // চোখ খোলামাত্র মিউজিক বন্ধ
  alarmAudio.currentTime = 0;
  if (beepTimer) { clearInterval(beepTimer); beepTimer = null; }
}

/* ================= ক্যামেরা ================= */
function showError(msg) {
  errText.textContent = msg;
  errBox.classList.add("show");
}

async function openCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw Object.assign(new Error("no-api"), { name: "InsecureContext" });
  }
  const tryFacing = async (mode) => navigator.mediaDevices.getUserMedia({
    video: { facingMode: mode, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  try {
    stream = await tryFacing(facing);
  } catch (e) {
    if (e.name === "OverconstrainedError" || e.name === "NotFoundError") {
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    } else throw e;
  }
  cam.srcObject = stream;
  cam.classList.toggle("mirror", facing === "user");
  await cam.play();
}

function explainCameraError(e) {
  switch (e.name) {
    case "NotAllowedError":
    case "PermissionDeniedError":
      return "ক্যামেরার অনুমতি দেওয়া হয়নি। ব্রাউজারের অ্যাড্রেস বারের পাশের তালা আইকনে ক্লিক করে ক্যামেরা চালু করে আবার চেষ্টা করো।";
    case "NotFoundError":
      return "কোনো ক্যামেরা পাওয়া যায়নি। ক্যামেরা লাগানো আছে কি না দেখো।";
    case "NotReadableError":
      return "ক্যামেরাটি অন্য কোনো অ্যাপ ব্যবহার করছে। সেটি বন্ধ করে আবার চেষ্টা করো।";
    case "InsecureContext":
      return "ক্যামেরা চালাতে সাইটটি HTTPS বা localhost এ খুলতে হবে।";
    default:
      return "ক্যামেরা চালু করা যায়নি: " + (e.message || e.name);
  }
}

/* ================= মডেল লোড ================= */
async function loadModel() {
  const { FaceLandmarker, FilesetResolver } = await import(MP_BUNDLE);
  const fileset = await FilesetResolver.forVisionTasks(MP_WASM);
  const make = (delegate) => FaceLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: MP_MODEL, delegate },
    runningMode: "VIDEO",
    numFaces: 1,
    outputFaceBlendshapes: true
  });
  try { landmarker = await make("GPU"); }
  catch (e) { landmarker = await make("CPU"); }
}

/* ================= চোখ ডিটেকশন লুপ ================= */
let closedSince = null;
let lastVideoTime = -1;

function setDot(state) {
  dot.className = state;   // loading | open | shut | (খালি = মুখ পাওয়া যায়নি)
}

function loop() {
  if (!running) return;
  if (landmarker && cam.readyState >= 2 && cam.currentTime !== lastVideoTime) {
    lastVideoTime = cam.currentTime;
    const res = landmarker.detectForVideo(cam, performance.now());
    const shapes = res.faceBlendshapes && res.faceBlendshapes[0];

    if (shapes) {
      const get = (name) => (shapes.categories.find(c => c.categoryName === name) || { score: 0 }).score;
      const closed = (get("eyeBlinkLeft") + get("eyeBlinkRight")) / 2 > CLOSED_THRESHOLD;
      const now = performance.now();

      if (closed) {
        if (closedSince === null) closedSince = now;
        setDot("shut");
        if (now - closedSince >= CLOSED_HOLD_MS) startAlarm();
      } else {
        closedSince = null;
        setDot("open");
        stopAlarm();          // চোখ খোলামাত্র আওয়াজ বন্ধ
      }
    } else {
      // মুখ দেখা যাচ্ছে না: অ্যালার্ম বন্ধ, ডট ধূসর
      closedSince = null;
      setDot("");
      stopAlarm();
    }
  }
  requestAnimationFrame(loop);
}

/* ================= শুরু ================= */
async function boot() {
  errBox.classList.remove("show");
  setDot("loading");
  try {
    await openCamera();
  } catch (e) {
    showError(explainCameraError(e));
    return;
  }
  intro.classList.add("hide");
  stage.classList.add("show");

  if (!landmarker) {
    try { await loadModel(); }
    catch (e) {
      console.error(e);
      showError("চোখ চেনার মডেল লোড হয়নি। ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করো।");
      return;
    }
  }
  running = true;
  setDot("");
  loop();

  // স্ক্রিন যেন বন্ধ না হয়ে যায়
  try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {}
}

$("startBtn").addEventListener("click", () => { unlockAudio(); boot(); });
$("retryBtn").addEventListener("click", () => { unlockAudio(); boot(); });

$("switchBtn").addEventListener("click", async () => {
  facing = facing === "user" ? "environment" : "user";
  running = false;
  stopAlarm();
  try {
    await openCamera();
  } catch (e) {
    facing = facing === "user" ? "environment" : "user";
    try { await openCamera(); } catch (e2) { showError(explainCameraError(e2)); return; }
  }
  lastVideoTime = -1; closedSince = null;
  running = true;
  loop();
});

// ট্যাব লুকালে অ্যালার্ম বন্ধ
document.addEventListener("visibilitychange", () => { if (document.hidden) stopAlarm(); });
</script>
